<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Site em aprovação com a cliente: tirar o noindex (aqui, no vercel.json e no robots.txt) só depois do ok. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F3EBDD" />
    <link rel="icon" type="image/jpeg" href="/logo-linda-flor.jpg" />
    <title>Linda Flor | Espaço Beleza · Veleiros, São Paulo</title>
    <meta
      name="description"
      content="Salão de bairro na Av. Juan Esper, 191, Veleiros (zona sul de SP). Manicure e pedicure com hora marcada pelo WhatsApp, de terça a sábado."
    />
    <!--
      Dados estruturados para o Google. Só fatos confirmados.
      Pendentes (ver PLACEHOLDERS.md): "url" (domínio) e "priceRange" (preços a confirmar). Não usar aggregateRating aqui: nota tirada do próprio site não vale para o Google.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["BeautySalon", "NailSalon"],
        "name": "Linda Flor | Espaço Beleza",
        "image": "/logo-linda-flor.jpg",
        "telephone": "+55-11-96436-2474",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Av. Juan Esper, 191",
          "addressLocality": "São Paulo",
          "addressRegion": "SP",
          "postalCode": "04771-000",
          "addressCountry": "BR"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "09:00",
            "closes": "18:00"
          }
        ],
        "areaServed": "Veleiros, São Paulo",
        "sameAs": ["https://www.instagram.com/lindaflorbelezaa/"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
